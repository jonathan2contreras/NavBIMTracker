<script>
// Start downloading the model right away (in parallel with the 3D libraries) instead of after they load.
// The server sends it gzip-compressed; X-File-Size is the real (decompressed) size, used for the progress bar.
window.__modelLoad = (function () {
  var listeners = [], last = 0;
  var promise = fetch('/api/model').then(function (res) {
    if (!res.ok) throw new Error('No se pudo descargar el modelo (HTTP ' + res.status + ')');
    var total = parseInt(res.headers.get('X-File-Size') || res.headers.get('Content-Length') || '0', 10) || 0;
    var reader = res.body.getReader();
    var buf = new Uint8Array(total || 1 << 24), loaded = 0;
    function pump() {
      return reader.read().then(function (r) {
        if (r.done) return buf.buffer.slice(0, loaded);
        var need = loaded + r.value.byteLength;
        if (need > buf.length) { var bigger = new Uint8Array(Math.max(need, buf.length * 2)); bigger.set(buf.subarray(0, loaded)); buf = bigger; }
        buf.set(r.value, loaded); loaded = need;
        last = total ? Math.min(99, Math.round(loaded / total * 100)) : 0;
        for (var i = 0; i < listeners.length; i++) listeners[i](last);
        return pump();
      });
    }
    return pump();
  });
  promise.catch(function () {});
  return { promise: promise, onProgress: function (fn) { listeners.push(fn); if (last) fn(last); } };
})();
</script>
<script type="importmap">
{"imports":{"three":"https://unpkg.com/three@0.160.0/build/three.module.js","three/addons/":"https://unpkg.com/three@0.160.0/examples/jsm/"}}
</script>
</head>
<body>
<canvas id="c"></canvas>
<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';

const STATUS_COLORS = { fabricado: 0x007AFF, enviado: 0xFF9500, instalado: 0x34C759, entregable: 0xF3EAD0, observaciones: 0xFFD60A };
const BASE_COLOR = 0xC9CFDA;

function send(msg) {
  const s = JSON.stringify(msg);
  if (window.ReactNativeWebView && window.ReactNativeWebView.postMessage) {
    window.ReactNativeWebView.postMessage(s);
  } else if (window.parent && window.parent !== window) {
    window.parent.postMessage(s, '*');
  }
}

const canvas = document.getElementById('c');
const renderer = new THREE.WebGLRenderer({ canvas, antialias: true, powerPreference: 'high-performance' });
renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, 1.5));
renderer.setSize(window.innerWidth, window.innerHeight);
renderer.setClearColor(0xEDEEF2);
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
renderer.shadowMap.autoUpdate = false; // static scene: recompute only when visibility changes

const scene = new THREE.Scene();
const camera = new THREE.PerspectiveCamera(55, window.innerWidth / window.innerHeight, 0.1, 10000);
scene.add(camera);

scene.add(new THREE.HemisphereLight(0xffffff, 0x3d4652, 0.65));
const dirLight = new THREE.DirectionalLight(0xffffff, 1.05);
dirLight.position.set(0.3, 0.5, 1);
camera.add(dirLight);
const fillLight = new THREE.DirectionalLight(0xffffff, 0.3);
fillLight.position.set(-1, -0.4, -0.6);
scene.add(fillLight);

const controls = new OrbitControls(camera, canvas);
controls.enableDamping = true;
controls.dampingFactor = 0.1;

let renderQueued = false;
function requestRender() {
  if (renderQueued) return;
  renderQueued = true;
  requestAnimationFrame(() => { renderQueued = false; controls.update(); renderer.render(scene, camera); sendHeading(); });
}
controls.addEventListener('change', requestRender);

// Compass heading: rotation (deg) to apply to a north-up rosette so N marks true north.
let lastHeading = null;
function sendHeading() {
  const fx = controls.target.x - camera.position.x;
  const fz = controls.target.z - camera.position.z;
  const forwardAngle = Math.atan2(fx, -fz) * 180 / Math.PI; // clockwise from north (-Z)
  const rot = -forwardAngle;
  if (lastHeading === null || Math.abs(rot - lastHeading) > 0.3) {
    lastHeading = rot;
    send({ type: 'heading', angle: rot });
  }
}

// damping needs a few frames after an actual drag (not after taps)
let dampingFrames = 0;
function dampLoop() {
  if (dampingFrames > 0) { dampingFrames--; requestRender(); requestAnimationFrame(dampLoop); }
}

window.addEventListener('resize', () => {
  camera.aspect = window.innerWidth / window.innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(window.innerWidth, window.innerHeight);
  requestRender();
});

// Materials (shared per status/highlight combo)
const matCache = {};
function matFor(status, highlighted) {
  const key = (status || 'none') + (highlighted ? '_hl' : '');
  if (!matCache[key]) {
    let color = status && STATUS_COLORS[status] ? STATUS_COLORS[status] : BASE_COLOR;
    // entregable: ivory when tagged, pure bright white when selected
    if (status === 'entregable' && highlighted) color = 0xFFFFFF;
    const m = new THREE.MeshLambertMaterial({ color, side: THREE.DoubleSide });
    if (status === 'entregable') {
      m.emissive = new THREE.Color(0xffffff).multiplyScalar(highlighted ? 0.85 : 0.3);
    } else if (highlighted) {
      m.emissive = new THREE.Color(status ? color : 0x2E6BD6).multiplyScalar(0.45);
    }
    matCache[key] = m;
  }
  return matCache[key];
}

// Black edge outlines (shared material + cached per-geometry edges)
const edgeMat = new THREE.LineBasicMaterial({ color: 0x111111 });
const edgeCache = new Map();
function edgesFor(geom) {
  if (!edgeCache.has(geom.uuid)) edgeCache.set(geom.uuid, new THREE.EdgesGeometry(geom, 25));
  return edgeCache.get(geom.uuid);
}

const meshesByName = {};
const meshList = [];
const outlineQueue = []; // meshes still waiting for their black outline
let tags = {};
let selectedName = null;
let pendingTags = null;
let pendingFocus = null;
let isolation = 'all';
let sceneMaxDim = 1;
let sceneCenter = new THREE.Vector3();
let sceneSize = new THREE.Vector3();
let loaded = false;

function isVisibleFor(name) {
  const st = tags[name] || null;
  return isolation === 'all' || (isolation === 'none' ? !st : st === isolation);
}

function refreshMesh(name) {
  const m = meshesByName[name];
  if (!m) return;
  m.material = matFor(tags[name] || null, name === selectedName || name === hoverName);
  setOutline(m, name === hoverName);
  m.visible = isVisibleFor(name);
  renderer.shadowMap.needsUpdate = true;
  requestRender();
}

// Hover highlight: soft glow + blue outline
const hoverEdgeMat = new THREE.LineBasicMaterial({ color: 0x007AFF, linewidth: 2 });
let hoverName = null;
function setOutline(mesh, hovered) {
  for (const ch of mesh.children) {
    if (ch.isLineSegments) ch.material = hovered ? hoverEdgeMat : edgeMat;
  }
}

function applyAll() {
  for (const mesh of meshList) {
    const key = mesh.userData.orig || mesh.name;
    mesh.material = matFor(tags[key] || null, key === selectedName || key === hoverName);
    mesh.visible = isVisibleFor(key);
  }
  renderer.shadowMap.needsUpdate = true;
  requestRender();
}

function animateCamera(toPos, toTarget) {
  const fromPos = camera.position.clone();
  const fromTarget = controls.target.clone();
  const start = performance.now();
  const dur = 700;
  function step() {
    const k = Math.min((performance.now() - start) / dur, 1);
    const e = 1 - Math.pow(1 - k, 3);
    camera.position.lerpVectors(fromPos, toPos, e);
    controls.target.lerpVectors(fromTarget, toTarget, e);
    controls.update();
    renderer.render(scene, camera);
    sendHeading();
    if (k < 1) requestAnimationFrame(step);
  }
  step();
}

function focusByName(name) {
  const m = meshesByName[name];
  if (!m) return;
  if (!m.visible) { isolation = 'all'; applyAll(); }
  const prev = selectedName;
  selectedName = name;
  if (prev) refreshMesh(prev);
  refreshMesh(name);
  const box = new THREE.Box3().setFromObject(m);
  const center = box.getCenter(new THREE.Vector3());
  const size = box.getSize(new THREE.Vector3());
  const radius = Math.max(size.length() / 2, sceneMaxDim * 0.01);
  const dist = Math.max((radius / Math.tan((camera.fov * Math.PI) / 360)) * 1.6, sceneMaxDim * 0.03);
  const dir = camera.position.clone().sub(controls.target).normalize();
  animateCamera(center.clone().add(dir.multiplyScalar(dist)), center);
}

window.viewerAPI = {
  applyTags(json) {
    const o = typeof json === 'string' ? JSON.parse(json) : (json || {});
    tags = o;
    if (!loaded) { pendingTags = o; return; }
    applyAll();
  },
  setTag(name, status) {
    if (status) tags[name] = status; else delete tags[name];
    refreshMesh(name);
  },
  clearSelection() {
    const prev = selectedName;
    selectedName = null;
    if (prev) refreshMesh(prev);
  },
  isolate(mode) {
    isolation = mode || 'all';
    if (!loaded) return;
    applyAll();
  },
  focusObject(name) {
    if (!loaded) { pendingFocus = name; return; }
    focusByName(name);
  },
  orientTo(facade) {
    if (!loaded) return;
    const c = sceneCenter;
    const dist = sceneMaxDim * 1.15;
    const y = c.y + sceneSize.y * 0.18;
    let pos;
    if (facade === 'norte') pos = new THREE.Vector3(c.x, y, c.z - dist);
    else if (facade === 'sur') pos = new THREE.Vector3(c.x, y, c.z + dist);
    else if (facade === 'este') pos = new THREE.Vector3(c.x + dist, y, c.z);
    else if (facade === 'oeste') pos = new THREE.Vector3(c.x - dist, y, c.z);
    else return;
    if (selectedName) { const prev = selectedName; selectedName = null; refreshMesh(prev); }
    animateCamera(pos, c.clone());
  },
};

// Command channel: works cross-origin (parent postMessage) and from RN WebView (injectJavaScript)
function handleCmd(data) {
  try {
    const msg = typeof data === 'string' ? JSON.parse(data) : data;
    if (!msg || !msg.__viewerCmd || !msg.cmd) return;
    const fn = window.viewerAPI[msg.cmd];
    if (typeof fn === 'function') fn.apply(window.viewerAPI, msg.args || []);
  } catch (e) {}
}
window.__handleViewerCmd = handleCmd;
window.addEventListener('message', (e) => handleCmd(e.data));

// Ground compass labels (Norte, Sur, Este, Oeste)
function makeGroundLabel(letter, word) {
  const cv = document.createElement('canvas');
  cv.width = 512; cv.height = 512;
  const ctx = cv.getContext('2d');
  ctx.clearRect(0, 0, 512, 512);
  ctx.fillStyle = '#1C1C1E';
  ctx.textAlign = 'center';
  ctx.font = '900 250px system-ui, -apple-system, sans-serif';
  ctx.fillText(letter, 256, 275);
  ctx.font = '700 78px system-ui, -apple-system, sans-serif';
  ctx.fillText(word, 256, 395);
  const tex = new THREE.CanvasTexture(cv);
  tex.anisotropy = 4;
  const mat = new THREE.MeshBasicMaterial({ map: tex, transparent: true, side: THREE.DoubleSide, depthWrite: false });
  const mesh = new THREE.Mesh(new THREE.PlaneGeometry(1, 1), mat);
  mesh.renderOrder = 1;
  mesh.raycast = () => {};
  return mesh;
}

function addCompassLabels(box, size, center, maxDim) {
  const groundY = box.min.y + maxDim * 0.005;
  const half = Math.max(size.x, size.z) / 2;
  const labelSize = maxDim * 0.14;
  const offset = half + labelSize * 0.9;
  const defs = [
    ['N', 'NORTE', 0, -offset],
    ['S', 'SUR', 0, offset],
    ['E', 'ESTE', offset, 0],
    ['O', 'OESTE', -offset, 0],
  ];
  for (const [letter, word, dx, dz] of defs) {
    const m = makeGroundLabel(letter, word);
    m.scale.set(labelSize, labelSize, 1);
    m.rotation.x = -Math.PI / 2;
    m.position.set(center.x + dx, groundY, center.z + dz);
    scene.add(m);
  }
}

// Load model
// GLTFLoader sanitizes node names (spaces -> _ and removes [ ] . : / ),
// so map sanitized names back to the original GLB node names.
function sanitizeName(name) {
  return name.replace(/\s/g, '_').replace(/[\[\]\.:\/]/g, '');
}

const loader = new GLTFLoader();
const onModelLoaded = (gltf) => {
    const root = gltf.scene;
    const origBySan = {};
    const jsonNodes = (gltf.parser && gltf.parser.json && gltf.parser.json.nodes) || [];
    for (const nd of jsonNodes) {
      if (nd && nd.name && nd.mesh !== undefined) origBySan[sanitizeName(nd.name)] = nd.name;
    }
    let i = 0;
    root.traverse((child) => {
      if (child.isMesh) {
        if (!child.geometry.attributes.normal) child.geometry.computeVertexNormals();
        if (!child.name) child.name = 'objeto_' + (i++);
        const orig = origBySan[child.name] || child.name;
        child.userData.orig = orig;
        child.material = matFor(null, false);
        child.castShadow = true;
        child.receiveShadow = true;
        outlineQueue.push(child);
        meshesByName[orig] = child;
        meshList.push(child);
      }
    });
    scene.add(root);
    const box = new THREE.Box3().setFromObject(root);
    const size = box.getSize(new THREE.Vector3());
    const center = box.getCenter(new THREE.Vector3());
    const maxDim = Math.max(size.x, size.y, size.z);
    sceneMaxDim = maxDim;
    sceneCenter.copy(center);
    sceneSize.copy(size);
    camera.near = Math.max(maxDim / 1000, 0.01);
    camera.far = maxDim * 20;
    camera.updateProjectionMatrix();
    camera.position.set(center.x + maxDim * 0.7, center.y + maxDim * 0.5, center.z + maxDim * 0.7);
    controls.target.copy(center);
    controls.maxDistance = maxDim * 5;
    controls.update();
    sendHeading();
    addCompassLabels(box, size, center, maxDim);

    // Fixed sun light with shadows fitted to the model bounds
    const sun = new THREE.DirectionalLight(0xffffff, 1.15);
    sun.position.set(center.x + maxDim * 0.6, box.max.y + maxDim * 0.8, center.z + maxDim * 0.4);
    sun.target.position.copy(center);
    sun.castShadow = true;
    sun.shadow.mapSize.set(2048, 2048);
    const r = size.length() / 2;
    const sc = sun.shadow.camera;
    sc.left = -r; sc.right = r; sc.top = r; sc.bottom = -r;
    sc.near = 0.1; sc.far = maxDim * 4;
    sun.shadow.bias = -0.0003;
    sun.shadow.normalBias = maxDim * 0.002;
    scene.add(sun);
    scene.add(sun.target);

    // Ground plane that receives the building's shadow
    const ground = new THREE.Mesh(
      new THREE.PlaneGeometry(maxDim * 4, maxDim * 4),
      new THREE.ShadowMaterial({ opacity: 0.22 })
    );
    ground.rotation.x = -Math.PI / 2;
    ground.position.set(center.x, box.min.y - maxDim * 0.001, center.z);
    ground.receiveShadow = true;
    ground.raycast = () => {};
    scene.add(ground);
    renderer.shadowMap.needsUpdate = true;
    loaded = true;
    if (pendingTags) { tags = pendingTags; pendingTags = null; }
    applyAll();
    if (pendingFocus) { const f = pendingFocus; pendingFocus = null; focusByName(f); }
    // Compute per-piece façade orientation (N=-Z, S=+Z, E=+X, O=-X) and persist once
    try {
      scene.updateMatrixWorld(true);
      const facadeMap = {};
      const dimsMap = {};
      const v = new THREE.Vector3();
      const bb = new THREE.Box3();
      const sz = new THREE.Vector3();
      for (const mesh of meshList) {
        if (!mesh.geometry.boundingSphere) mesh.geometry.computeBoundingSphere();
        v.copy(mesh.geometry.boundingSphere.center).applyMatrix4(mesh.matrixWorld);
        const dx = v.x - center.x, dz = v.z - center.z;
        const key = mesh.userData.orig || mesh.name;
        facadeMap[key] =
          Math.abs(dx) > Math.abs(dz) ? (dx > 0 ? 'este' : 'oeste') : (dz > 0 ? 'sur' : 'norte');
        if (!mesh.geometry.boundingBox) mesh.geometry.computeBoundingBox();
        bb.copy(mesh.geometry.boundingBox).applyMatrix4(mesh.matrixWorld);
        bb.getSize(sz);
        dimsMap[key] = [sz.x, sz.y, sz.z];
      }
      fetch('/api/facades/count')
        .then((r) => r.json())
        .then((d) => {
          if (!d.count) {
            fetch('/api/facades', {
              method: 'POST',
              headers: { 'Content-Type': 'application/json' },
              body: JSON.stringify({ facades: facadeMap }),
            });
          }
        })
        .catch(() => {});
      fetch('/api/dims/count')
        .then((r) => r.json())
        .then((d) => {
          if (!d.count) {
            fetch('/api/dims', {
              method: 'POST',
              headers: { 'Content-Type': 'application/json' },
              body: JSON.stringify({ dims: dimsMap }),
            });
          }
        })
        .catch(() => {});
    } catch (e) {}
    send({ type: 'loaded', count: meshList.length });
    buildOutlines();
};

const onModelError = (err) => {
  send({ type: 'error', message: String(err && err.message ? err.message : err) });
};

window.__modelLoad.onProgress((pct) => send({ type: 'progress', pct }));
window.__modelLoad.promise.then((data) => loader.parse(data, '', onModelLoaded, onModelError), onModelError);

// Black outlines: computing them for ~5,500 geometries takes seconds, so the model is shown and usable first
// and the outlines are added in small time slices that never block touch/drag.
function buildOutlines() {
  let index = 0;
  const step = () => {
    const start = performance.now();
    while (index < outlineQueue.length && performance.now() - start < 10) {
      const child = outlineQueue[index++];
      const outline = new THREE.LineSegments(edgesFor(child.geometry), edgeMat);
      outline.raycast = () => {};
      child.add(outline);
    }
    if (index < outlineQueue.length) { setTimeout(step, 0); if (index % 400 < 40) requestRender(); }
    else { outlineQueue.length = 0; requestRender(); }
  };
  setTimeout(step, 0);
}

// Tap to select (distinguish tap from drag)
const raycaster = new THREE.Raycaster();
const pointer = new THREE.Vector2();
let downX = 0, downY = 0, downT = 0;

canvas.addEventListener('pointerdown', (e) => { downX = e.clientX; downY = e.clientY; downT = Date.now(); });
canvas.addEventListener('pointerup', (e) => {
  const dist = Math.hypot(e.clientX - downX, e.clientY - downY);
  if (dist > 10) { dampingFrames = 12; dampLoop(); return; }
  if (Date.now() - downT > 600 || !loaded) return;
  pointer.x = (e.clientX / window.innerWidth) * 2 - 1;
  pointer.y = -(e.clientY / window.innerHeight) * 2 + 1;
  raycaster.setFromCamera(pointer, camera);
  const hits = raycaster.intersectObjects(meshList.filter((m) => m.visible), false);
  if (hits.length > 0) {
    const name = hits[0].object.userData.orig || hits[0].object.name;
    const prev = selectedName;
    selectedName = name;
    if (prev) refreshMesh(prev);
    refreshMesh(name);
    send({ type: 'select', name });
  }
});

// Hover (mouse only): find piece under cursor, highlight it and report its code
function pickAt(x, y) {
  pointer.x = (x / window.innerWidth) * 2 - 1;
  pointer.y = -(y / window.innerHeight) * 2 + 1;
  raycaster.setFromCamera(pointer, camera);
  const hits = raycaster.intersectObjects(meshList.filter((m) => m.visible), false);
  return hits.length > 0 ? (hits[0].object.userData.orig || hits[0].object.name) : null;
}

function setHover(name, x, y) {
  if (name === hoverName) {
    if (name) send({ type: 'hover', name, x, y });
    return;
  }
  const prev = hoverName;
  hoverName = name;
  if (prev) refreshMesh(prev);
  if (name) refreshMesh(name);
  send({ type: 'hover', name, x, y });
}

let hoverPending = null;
let hoverScheduled = false;
canvas.addEventListener('pointermove', (e) => {
  if (e.pointerType !== 'mouse' || !loaded) return;
  if (e.buttons) { if (hoverName) setHover(null, 0, 0); return; }
  hoverPending = { x: e.clientX, y: e.clientY };
  if (hoverScheduled) return;
  hoverScheduled = true;
  requestAnimationFrame(() => {
    hoverScheduled = false;
    const p = hoverPending;
    if (!p) return;
    setHover(pickAt(p.x, p.y), p.x, p.y);
  });
});
canvas.addEventListener('pointerleave', () => { if (hoverName) setHover(null, 0, 0); });
canvas.addEventListener('pointerdown', (e) => { if (e.pointerType === 'mouse' && hoverName) setHover(null, 0, 0); });

send({ type: 'ready' });
</script>
</body>
</html>
